name: CI

on:
  push:
    branches: [master]
    paths-ignore:
      - "apps/docs/**"
      - "docs/**"
      - "**.md"
      - "!.changeset/**"
  pull_request:
    branches: [master]
    paths-ignore:
      - "apps/docs/**"
      - "docs/**"
      - "**.md"
      - "!.changeset/**"

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test
